<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" fill="url(#grid)" opacity="0.5"/>

  <!-- Halo central -->
  <circle cx="256" cy="256" r="195" fill="url(#glow)"/>

  <!-- Icône Boîtier PC Gamer -->
  <g transform="translate(156, 106)">
    <!-- Châssis -->
    <rect x="0" y="0" width="200" height="300" rx="22" fill="#0F172A" stroke="url(#accent)" stroke-width="8"/>

    <!-- Vitre latérale -->
    <rect x="20" y="22" width="128" height="176" rx="12" fill="#1E293B" fill-opacity="0.6" stroke="#334155" stroke-width="4"/>

    <!-- CPU / Ventirad -->
    <rect x="40" y="42" width="56" height="56" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="5"/>
    <circle cx="68" cy="70" r="15" fill="none" stroke="#818CF8" stroke-width="4.5"/>

    <!-- Carte graphique (GPU) -->
    <rect x="36" y="132" width="96" height="24" rx="6" fill="url(#accent)"/>

    <!-- Compartiment alimentation -->
    <rect x="20" y="218" width="128" height="58" rx="10" fill="#1E293B" stroke="#334155" stroke-width="4"/>

    <!-- Ventilation LED en façade -->
    <line x1="170" y1="37" x2="170" y2="183" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-dasharray="34 22"/>

    <!-- Bouton Power -->
    <circle cx="170" cy="247" r="7" fill="#38BDF8"/>
  </g>
</svg>
