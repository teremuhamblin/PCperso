name: Documentation checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-links:
    name: Check local Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check relative links and UTF-8 Markdown
        run: python3 scripts/check_markdown_links.py
